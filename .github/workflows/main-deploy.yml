name: Main build & Deploy

on:
  push:
    branches: [main, map_api_key_added]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to docker hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_LOGIN }} --password-stdin
      - name: Build docker image
        run: docker build -t unsignedgodeveloper/matury-backend ./backend
      - name: Push image to docker hub
        run: docker push unsignedgodeveloper/matury-backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to docker hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_LOGIN }} --password-stdin
      - name: Build docker image
        run: docker build -t unsignedgodeveloper/matury-frontend ./frontend
      - name: Push image to docker hub
        run: docker push unsignedgodeveloper/matury-frontend

  build-reverse-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to docker hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_LOGIN }} --password-stdin
      - name: Build docker image
        run: docker build -t unsignedgodeveloper/matury-reverse-proxy ./nginx
      - name: Push image to docker hub
        run: docker push unsignedgodeveloper/matury-reverse-proxy

  deploy:
    needs: [build-reverse-proxy, build-backend, build-frontend]
    runs-on: self-hosted
    steps:
      - name: Create docker-compose.yml
        run: |
          cat <<EOF > docker-compose.yml
          services:
            postgres: 
              image: postgres:15
              container_name: postgres
              environment:
                POSTGRES_DB: postgres
                POSTGRES_USER: myuser
                POSTGRES_PASSWORD: mypass
              ports:
                - "5432:5432"
              volumes:
                - postgres_data:/var/lib/postgresql/data
              restart: always
            frontend:
              image: unsignedgodeveloper/matury-frontend:latest
              environment:
                - GOOGLE_MAPS_API_KEY
              container_name: frontend
              restart: always
              ports:
                - "3000:3000"
              depends_on:
                - backend
                - nginx

            backend:
              image: unsignedgodeveloper/matury-backend:latest
              container_name: backend
              restart: always
              ports:
                - "8080:8080"
              depends_on:
                - postgres

            nginx:
              image: unsignedgodeveloper/matury-reverse-proxy:latest
              container_name: reverse-proxy
              restart: always
              ports:
                - "80:80"
                - "443:443"
              depends_on:
                - backend
          volumes:
            postgres_data:
          EOF
          cat <<EOF > .env
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          EOF

      - name: Stop and remove old containers
        run: sudo docker-compose --env-file .env -f docker-compose.yml down
      - name: Pull containers
        run: sudo docker-compose --env-file .env -f docker-compose.yml pull
      - name: Start containers
        run: sudo docker-compose --env-file .env -f docker-compose.yml up -d
      - name: Cleanup env file
        run: rm -f .env
